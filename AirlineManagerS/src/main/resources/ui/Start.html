<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Reservation</title>
    <style>
     :root 
     { 
         --primary: #1e40af; 
         --primary-hover: #1d4ed8; 
         --bg: #f1f5f9; 
         --card-bg: #ffffff; 
         --text: #0f172a; 
         --border: #cbd5e1; 
     }
    body 
    { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        background-color: var(--bg); 
        color: var(--text);
        margin: 0; 
        padding: 20px; 
    }
    header 
    { 
        background-color: var(--primary); 
        color: white; 
        padding: 15px 20px; 
        border-radius: 8px; 
        margin-bottom: 20px; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
    }
    nav 
    { 
        display: flex; 
        gap: 10px; 
        margin-bottom: 20px; 
    }
    nav a.nav-btn 
    { 
        background-color: #e2e8f0; 
        border: none; 
        padding: 10px 18px; 
        border-radius: 6px; 
        cursor: pointer; 
        font-weight: 600; 
        color: var(--text); 
        text-decoration: none; 
        transition: all 0.2s; 
    }
    nav a.nav-btn.active 
    { 
        background-color: var(--primary); 
        color: white; 
    }
    .page 
    { 
        background: var(--card-bg); 
        padding: 25px; 
        border-radius: 8px; 
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
        max-width: 600px; 
        margin: 0 auto; 
    }
    h2 
    { 
        margin-top: 0; 
        color: var(--primary); 
        border-bottom: 2px solid var(--bg); 
        padding-bottom: 10px; 
    }
    .form-group 
    { 
        margin-bottom: 15px; 
    }
    label 
    { 
        display: block; 
        margin-bottom: 5px; 
        font-weight: 600; 
    }
    input, select 
    { 
        width: 100%; 
        padding: 10px; 
        border: 1px solid var(--border); 
        border-radius: 6px; 
        box-sizing: border-box; 
    }
    button.btn-submit 
    { 
        background-color: var(--primary); 
        color: white; 
        border: none; 
        padding: 12px; 
        width: 100%; 
        border-radius: 6px; 
        font-weight: bold; 
        cursor: pointer; 
        margin-top: 10px; 
    }
    button.btn-submit:hover 
    { 
        background-color: var(--primary-hover); 
    }
  </style>
</head>
<body>

    <h2>Start Reservation</h2>

    
    <form action="/startReservation" method="post">
        <div class="form-group">
            <label for="name">Employee Name:</label>
            <input type="text" id="name" name="name" required>
         </div>
        <div class="form-group">
            <label for="flightNumber">Select Flight:</label>
            <select id="flightNumber" name="flightNumber" required>
                   <option value="AA101">Flight AA101 (Boeing 737)</option>
            </select>
        </div>
        <button type="submit" class="btn-submit">Start Reservation</button>
     </form>

</body>
</html>
