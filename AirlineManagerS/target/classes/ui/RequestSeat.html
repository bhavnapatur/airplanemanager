<!DOCTYPE html>
<html>
<head>
    <title>Request Seat</title>
    <style>
        :root 
        {
          --primary: #1e40af;
          --bg: #f1f5f9;
          --card-bg: #ffffff;
          --text: #0f172a;
          --border: #cbd5e1;
        }

        body 
        {
          font-family: sans-serif;
          background: var(--bg);
          color: var(--text);
          padding: 20px;
        }

        nav 
        {
          display: flex;
          gap: 10px;
          margin-bottom: 20px;
        }

        nav a.nav-btn 
        {
          background: #e2e8f0;
          padding: 10px 18px;
          border-radius: 6px;
          font-weight: 600;
          color: var(--text);
          text-decoration: none;
        }

        nav a.nav-btn.active 
        {
          background: var(--primary);
          color: white;
        }

        .page 
        {
          background: var(--card-bg);
          padding: 25px;
          border-radius: 8px;
          max-width: 600px;
          margin: 0 auto;
        }

        .form-group 
        {
          margin-bottom: 15px;
        }

        label 
        {
          display: block;
          margin-bottom: 5px;
          font-weight: 600;
        }

        input 
        {
          width: 100%;
          padding: 10px;
          border: 1px solid var(--border);
          border-radius: 6px;
          box-sizing: border-box;
        }

        button.btn-submit 
        {
          background-color: var(--primary);
          color: white;
          border: none;
          padding: 12px;
          width: 100%;
          border-radius: 6px;
          font-weight: bold;
          cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="page">
        <h2>Reserve Seat</h2>
        <nav>
            <a href="/SeatMap.html" class="nav-btn">Seat Map</a>
            <a href="/RequestSeat.html" class="nav-btn active">Request Seat</a>
            <a href="/LayoutManager.html" class="nav-btn">Layout Manager</a>
        </nav>

        <h3>Request Seat</h3>
        <form action="/submitSeat" method="post">
            <div class="form-group">
                <label>Passenger Name:</label>
                <input type="text" name="name" placeholder="Name" required>
            </div>
            <div class="form-group">
                <label>Seat Number:</label>
                <input type="text" name="seat" placeholder="1C" required>
            </div>
            <button type="submit" class="btn-submit">Confirm Reservation</button>
        </form>
        <hr>
        <h3>Cancel Reservation</h3>
        <form action="/cancelSeat" method="post">
            <div class="form-group">
                <label>Seat Number:</label>
                <input type="text" name="seatNumber" placeholder="1C" required>
            </div>
            <button type="submit" class="btn-submit">Confirm Reservation</button>
        </form>
    </div>
</body>
</html>
